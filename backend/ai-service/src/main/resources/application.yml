# AI Service (cổng 8086): gọi Claude qua SDK chính thức của Anthropic, đếm lượt AI theo gói (WMS-24.1).
# Chưa có CSDL: không khai báo datasource, không JPA, không Flyway. Redis giữ bộ đếm lượt AI và bộ nhớ đệm thuê bao.
server:
  port: ${SERVER_PORT:8086}
  shutdown: graceful

spring:
  application:
    name: ai-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  autoconfigure:
    exclude:
      # Không dùng user in-memory mặc định của Spring Boot (tránh in "generated security password" ra log).
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      # Chỉ dùng cho dev; production đặt HEALTH_SHOW_DETAILS=never
      show-details: ${HEALTH_SHOW_DETAILS:always}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  # Tách dữ liệu theo doanh nghiệp từ ngày đầu (docs/MULTI_TENANT.md): request không xác định được doanh nghiệp nhận
  # 403 COMPANY_REQUIRED. Doanh nghiệp mặc định chỉ đặt ở máy phát triển, máy chủ để rỗng.
  tenant:
    required: true
    default-company-id: ${TENANT_DEFAULT_COMPANY_ID:}
  # Gọi Claude (xem vn.wms.ai.config.AiProperties). Khóa KHÔNG đặt ở đây: SDK đọc biến môi trường ANTHROPIC_API_KEY.
  # AI_MOCK=true (mặc định) hoặc chưa có khóa: trả câu trả lời mẫu, không gọi Claude.
  ai:
    mock: ${AI_MOCK:true}
    model: ${AI_MODEL:claude-sonnet-5-5}
    # Mức suy nghĩ gửi qua output_config.effort: low, medium hoặc high.
    effort: ${AI_EFFORT:low}
    max-tokens: ${AI_MAX_TOKENS:4096}
    # Quá thời gian chờ thì báo lỗi 503 và không trừ lượt (docs/SAAS_SPEC.md, WMS-24.1).
    timeout: 60s
    max-retries: 1
    # fallbacks: "default" (beta server-side-fallback-2026-07-01). Đặt AI_SERVER_FALLBACK=false nếu API từ chối tham số này.
    server-fallback: ${AI_SERVER_FALLBACK:true}
    # Câu trả lời giả lập vẫn bị tính lượt để thử được giới hạn gói khi chưa có khóa.
    mock-counts-usage: ${AI_MOCK_COUNTS_USAGE:true}
---
# Nạp cấu hình tập trung từ Config Server. Tiền tố optional nghĩa là Config Server chưa chạy thì service vẫn
# khởi động bằng cấu hình cục bộ ở trên. Tài liệu này bị bỏ qua khi chạy test (profile test) để test không gọi mạng.
spring:
  config:
    activate:
      on-profile: "!test"
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
