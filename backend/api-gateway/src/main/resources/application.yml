# API Gateway (cổng 8080): điểm vào duy nhất cho frontend, route /api/** tới các service qua Eureka.
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: api-gateway
  data:
    redis:
      # Redis dùng cho RequestRateLimiter (cùng REDIS_HOST với các service, xem docker-compose.yml)
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    loadbalancer:
      cache:
        # Dev: làm mới danh sách instance mỗi 5 giây (mặc định 35 giây), khớp với eureka.client.registry-fetch-interval-seconds bên dưới.
        ttl: 5s
    gateway:
      # CORS cho frontend (Vite dev server). Nhiều origin: CORS_ALLOWED_ORIGINS=http://a.com,http://b.com
      globalcors:
        cors-configurations:
          "[/**]":
            allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:5173}"
            allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
            allowed-headers: "*"
            allow-credentials: true
            max-age: 3600
      # Tránh trùng header CORS nếu service phía sau cũng trả CORS
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
        # Giới hạn tốc độ (NFR05, WMS-01.3): token bucket trên Redis theo người dùng đã đăng nhập (X-User-Name)
        # hoặc theo IP khi chưa đăng nhập; vượt ngưỡng trả 429 Too Many Requests. Xem vn.wms.gateway.ratelimit.
        - name: RequestRateLimiter
          args:
            key-resolver: "#{@userOrIpKeyResolver}"
            # Số token nạp lại mỗi giây (tốc độ ổn định) và sức chứa tối đa (cho phép bùng nổ ngắn)
            redis-rate-limiter.replenishRate: ${RATE_LIMIT_REPLENISH_RATE:20}
            redis-rate-limiter.burstCapacity: ${RATE_LIMIT_BURST_CAPACITY:40}
            redis-rate-limiter.requestedTokens: 1
            # Không có khóa (tắt giới hạn tốc độ) thì cho qua thay vì chặn
            deny-empty-key: false
      # Giữ nguyên đường dẫn /api/... khi chuyển tiếp (các service khai báo đường dẫn đầy đủ).
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**,/api/users/**
        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/api/products/**
        - id: inventory-service
          uri: lb://inventory-service
          predicates:
            - Path=/api/inventory/**
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**
        # Hub WebSocket STOMP của notification-service (WMS-02.3): handshake SockJS (/ws-wms/info, /ws-wms/{server}/{session}/...)
        # và WebSocket thuần (/ws-wms). Request có header Upgrade: websocket được WebsocketRoutingFilter tự đổi http sang ws
        # sau khi load balancer chọn instance, nên dùng lb:// như các route khác.
        - id: notification-websocket
          uri: lb://notification-service
          predicates:
            - Path=/ws-wms/**

eureka:
  client:
    service-url:
      defaultZone: "${EUREKA_URL:http://localhost:8761/eureka/}"
    # Dev: kéo danh sách service từ Eureka mỗi 5 giây (mặc định 30 giây) để service mới khởi động được route nhanh.
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true

# Kiểm tra JWT tại gateway (xem JwtAuthenticationGlobalFilter).
gateway:
  jwt:
    # Mặc định TẮT ở máy phát triển để nhóm gọi API không bị chặn; production bật qua deploy/docker-compose.prod.yml.
    # Bật (GATEWAY_JWT_ENABLED=true trong .env) thì gateway mới chuyển tiếp X-User-Name, X-User-Roles, X-User-Warehouse-Ids,
    # nhờ đó các service lọc dữ liệu theo kho được phân quyền (WMS-04.2), và X-Company-Id để lọc theo doanh nghiệp (WMS-22.3).
    enabled: ${GATEWAY_JWT_ENABLED:true}
    # PHẢI trùng JWT_SECRET của auth-service. Chỉ là giá trị dev, đổi ở môi trường thật.
    secret: ${JWT_SECRET:change_me_dev_only_jwt_secret_key_min_32_bytes}
    # Token hợp lệ nhưng không có claim companyId (cấp trước khi chuyển sang mô hình nhiều doanh nghiệp) thì trả 401
    # để người dùng đăng nhập lại. Chỉ đặt GATEWAY_COMPANY_REQUIRED=false khi auth-service chưa cấp claim này.
    require-company: ${GATEWAY_COMPANY_REQUIRED:true}
    public-paths:
      - /api/auth/login
      - /api/auth/refresh
      # Các API không cần đăng nhập của phần SaaS (docs/SAAS_SPEC.md): đăng ký và kích hoạt doanh nghiệp,
      # quên và đặt lại mật khẩu, danh sách gói, webhook thanh toán PayOS (tự kiểm tra chữ ký).
      - /api/auth/companies/register
      - /api/auth/companies/activate
      - /api/auth/companies/resend-activation
      - /api/auth/password/**
      - /api/auth/plans
      - /api/auth/payments/payos/webhook
      - /actuator/**
      # Handshake WebSocket từ trình duyệt không mang được header Bearer; notification-service kiểm tra JWT ở frame STOMP CONNECT.
      - /ws-wms/**
  # Thuê bao (WMS-23.2, xem SubscriptionGlobalFilter): gắn X-Plan từ hash Redis wms:subscription:{companyId} do auth-service
  # ghi, và khi thuê bao EXPIRED thì chặn POST, PUT, PATCH, DELETE (403 SUBSCRIPTION_EXPIRED) trừ các đường dẫn dưới đây.
  # Thiếu hash hoặc Redis lỗi thì cho qua. Chỉ có tác dụng khi gateway.jwt.enabled=true (mới có X-Company-Id).
  subscription:
    enabled: ${GATEWAY_SUBSCRIPTION_ENABLED:true}
    write-allowed-paths:
      - /api/auth/login
      - /api/auth/refresh
      - /api/auth/logout
      - /api/users/change-password
      - /api/auth/users/change-password
      - /api/auth/subscription/**
      - /api/auth/payments/**
  rate-limit:
    # Tắt (RATE_LIMIT_ENABLED=false) khi chạy kiểm thử tải JMeter (WMS-19.2) để gateway không chặn kịch bản.
    enabled: ${RATE_LIMIT_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      # Chỉ dùng cho dev; production đặt HEALTH_SHOW_DETAILS=never
      show-details: ${HEALTH_SHOW_DETAILS:always}

---
# Nạp cấu hình tập trung từ Config Server. Tiền tố optional nghĩa là Config Server chưa chạy thì service vẫn
# khởi động bằng cấu hình cục bộ ở trên. Tài liệu này bị bỏ qua khi chạy test (profile test) để test không gọi mạng;
# lý do: đặt spring.cloud.config.enabled=false cùng với import configserver làm Spring Boot báo lỗi vị trí không được hỗ trợ.
spring:
  config:
    activate:
      on-profile: "!test"
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
