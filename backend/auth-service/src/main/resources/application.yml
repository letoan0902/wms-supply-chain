# Auth Service (cổng 8081): tài khoản, JWT, RBAC.
server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

spring:
  application:
    name: auth-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  autoconfigure:
    exclude:
      # Không dùng user in-memory mặc định của Spring Boot (tránh in "generated security password" ra log).
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/auth_db?createDatabaseIfNotExist=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:change_me}
  jpa:
    open-in-view: false
    hibernate:
      # Schema do Flyway quản lý; Hibernate chỉ kiểm tra entity khớp schema.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # Nạp quan hệ lazy theo lô (một câu IN cho cả trang) thay vì một câu cho mỗi bản ghi (WMS-19.3, docs/PERFORMANCE.md)
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      # Chỉ dùng cho dev; production đặt HEALTH_SHOW_DETAILS=never
      show-details: ${HEALTH_SHOW_DETAILS:always}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  jwt:
    # Khóa ký HS256 (tối thiểu 32 byte). Chỉ là giá trị dev - ĐỔI ở môi trường thật và giữ trùng với api-gateway.
    secret: ${JWT_SECRET:change_me_dev_only_jwt_secret_key_min_32_bytes}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:15}
    issuer: wms-auth-service
  auth:
    dev-login:
      # Đăng nhập giả lập cho giai đoạn khung. TODO: đặt false khi đã có đăng nhập thật dựa trên bảng users.
      enabled: ${AUTH_DEV_LOGIN_ENABLED:true}
      password: ${AUTH_DEV_PASSWORD:change_me}
  demo-tools: ${APP_DEMO_TOOLS:false}
  # Địa chỉ gốc của giao diện, dùng dựng liên kết trong email kích hoạt và đặt lại mật khẩu (WMS-23.6):
  # {APP_FRONTEND_URL}/activate?token=..., {APP_FRONTEND_URL}/reset-password?token=...
  # Để trống thì dùng gốc của PAYOS_RETURN_URL (mặc định http://localhost:5173).
  frontend-url: ${APP_FRONTEND_URL:}
  registration:
    # true (mặc định, bắt buộc ở production): doanh nghiệp mới ở trạng thái PENDING cho tới khi bấm liên kết kích hoạt
    # trong email. Chỉ đặt false trên máy phát triển không có mail để đăng ký xong đăng nhập được ngay.
    require-activation: ${REGISTRATION_REQUIRE_ACTIVATION:true}
  # Liên kết dùng một lần (WMS-23.6, vn.wms.auth.account): hiệu lực, giới hạn gửi lại và xử lý nền để phản hồi của
  # API gửi lại kích hoạt và quên mật khẩu không để lộ email có tồn tại hay không.
  account-email:
    async: true
    activation-ttl: 24h
    password-reset-ttl: 30m
    resend-interval: 1m
  # API key cho hệ thống ngoài (WMS-25.1, xem vn.wms.auth.apikey.service.ApiKeyScheduler): chu kỳ ghi lại toàn bộ
  # khóa wms:apikey:{sha256} lên Redis và chu kỳ đổ lần dùng gần nhất (gateway ghi trên Redis) vào cột last_used_at.
  api-key:
    sync-interval-ms: 300000
    last-used-flush-ms: 60000
  # Thanh toán PayOS (WMS-23.5a). Ba khóa chỉ đặt trong .env trên máy chủ, không commit, không ghi log.
  # Để trống URL thì dùng http://localhost:5173/payment/result (máy phát triển chạy Vite).
  payos:
    client-id: ${PAYOS_CLIENT_ID:}
    api-key: ${PAYOS_API_KEY:}
    checksum-key: ${PAYOS_CHECKSUM_KEY:}
    return-url: ${PAYOS_RETURN_URL:}
    cancel-url: ${PAYOS_CANCEL_URL:}
    base-url: ${PAYOS_BASE_URL:https://api-merchant.payos.vn}
    mock: ${PAYOS_MOCK:true}

payos:
  mock: ${PAYOS_MOCK:true}

---
# Nạp cấu hình tập trung từ Config Server. Tiền tố optional nghĩa là Config Server chưa chạy thì service vẫn
# khởi động bằng cấu hình cục bộ ở trên. Tài liệu này bị bỏ qua khi chạy test (profile test) để test không gọi mạng.
spring:
  config:
    activate:
      on-profile: "!test"
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
