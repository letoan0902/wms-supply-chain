# Cấu hình cho test: H2 trong bộ nhớ, Hibernate tự tạo schema, tắt Flyway/Eureka/Config Server.
# Import Config Server đã bị bỏ qua ở profile test (xem application.yml); đặt thêm spring.cloud.config.enabled=false
# để Spring Cloud không đòi spring.config.import.
spring:
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:h2:mem:auth_test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
eureka:
  client:
    enabled: false
# Tác vụ định kỳ của API key (WMS-25.1) không chạy trong lúc test để không ghi đè dữ liệu Redis giả lập;
# test gọi thẳng ApiKeyService.syncAllToRedis() và flushLastUsed().
app:
  api-key:
    sync-initial-delay-ms: 3600000
    last-used-flush-ms: 3600000
