// Thư viện dùng chung cho các service nghiệp vụ (servlet / Spring MVC).
// KHÔNG dùng cho api-gateway (WebFlux) vì sẽ kéo Spring MVC vào classpath của gateway.
plugins {
    id 'java-library'
}

dependencies {
    // Chỉ khai báo compileOnly: mỗi service tự mang starter tương ứng (web, validation, security, data-jpa),
    // tránh ép các thư viện này vào service không cần.
    compileOnly 'org.springframework.boot:spring-boot-starter-web'
    compileOnly 'org.springframework.security:spring-security-core'
    compileOnly 'org.springframework.data:spring-data-commons'
    compileOnly 'org.springframework.boot:spring-boot-starter-data-jpa'

    // API ràng buộc dữ liệu (chỉ là interface, nhẹ) để GlobalExceptionHandler xử lý ConstraintViolationException.
    api 'jakarta.validation:jakarta.validation-api'

    testImplementation 'org.springframework.boot:spring-boot-starter-web'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-core'
    testImplementation 'org.springframework.data:spring-data-commons'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa'
}
