# Config Server (cổng 8888): phân phối cấu hình tập trung cho các service.
server:
  port: ${SERVER_PORT:8888}
  shutdown: graceful

spring:
  application:
    name: config-server
  profiles:
    # Bật profile native để đọc cấu hình từ classpath/thư mục thay vì Git.
    # Dùng include (thay vì active) để profile native không bị mất khi chạy với SPRING_PROFILES_ACTIVE khác.
    include: native
  cloud:
    config:
      server:
        native:
          # Mặc định đọc thư mục config-repo đã đóng gói trong jar (src/main/resources/config-repo).
          # Muốn sửa cấu hình không cần build lại, trỏ ra thư mục ngoài: CONFIG_REPO_LOCATIONS=file:/config-repo/
          search-locations: ${CONFIG_REPO_LOCATIONS:classpath:/config-repo/}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      # Chỉ dùng cho dev; production đặt HEALTH_SHOW_DETAILS=never
      show-details: ${HEALTH_SHOW_DETAILS:always}
