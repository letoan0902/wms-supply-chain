# =============================================================================================
# Cấu hình DÙNG CHUNG cho mọi service (client của Config Server): eureka, mysql, redis, rabbitmq.
#
# Lưu ý quan trọng:
#  - Giá trị ở đây có độ ưu tiên CAO HƠN application.yml cục bộ trong từng service. Vì vậy các biểu thức
#    biến môi trường bên dưới phải GIỮ ĐỒNG BỘ với application.yml của service (tên biến, giá trị mặc định).
#  - KHÔNG đặt spring.datasource.url ở đây: mỗi service dùng một database riêng (auth_db, product_db, ...),
#    URL do application.yml của từng service quyết định (biến DB_URL).
#  - Mật khẩu chỉ là giá trị mặc định cho môi trường dev (change_me), luôn đọc từ biến môi trường.
# =============================================================================================
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

spring:
  datasource:
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:change_me}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  jpa:
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
