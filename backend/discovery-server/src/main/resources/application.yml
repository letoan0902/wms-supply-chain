# Discovery Server - Eureka (cổng 8761).
# Chủ ý KHÔNG import Config Server: đây là thành phần nền tảng, phải khởi động độc lập được.
server:
  port: ${SERVER_PORT:8761}
  shutdown: graceful

spring:
  application:
    name: discovery-server

eureka:
  instance:
    hostname: ${EUREKA_HOSTNAME:localhost}
  client:
    # Server đứng một mình: không tự đăng ký và không kéo registry từ nơi khác.
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
  server:
    # Dev: tắt self-preservation để instance đã tắt bị loại khỏi registry nhanh, gateway không route nhầm.
    # Production nên đặt EUREKA_SELF_PRESERVATION=true.
    enable-self-preservation: ${EUREKA_SELF_PRESERVATION:false}
    # Dev: tắt bộ nhớ đệm chỉ-đọc 30 giây của Eureka để service vừa đăng ký được client nhìn thấy ngay.
    # Production nên bật lại (đặt EUREKA_SERVER_USE_READ_ONLY_RESPONSE_CACHE=true) để giảm tải.
    use-read-only-response-cache: false
    wait-time-in-ms-when-sync-empty: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      # Chỉ dùng cho dev; production đặt HEALTH_SHOW_DETAILS=never
      show-details: ${HEALTH_SHOW_DETAILS:always}
