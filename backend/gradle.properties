# Cấu hình Gradle và phiên bản thư viện dùng chung cho toàn bộ monorepo backend.
# Đây là nơi duy nhất để nâng cấp phiên bản các thư viện không nằm trong BOM của Spring Boot.

# --- JVM của Gradle ---
org.gradle.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# --- Thông tin dự án (áp dụng cho mọi module) ---
group=vn.wms
version=0.1.0-SNAPSHOT

# --- Phiên bản thư viện ---
# Spring Boot 3.3.x khai báo trong build.gradle (plugins). Spring Cloud 2023.0.x tương thích Boot 3.2/3.3.
springCloudVersion=2023.0.6
# JWT (jjwt) dùng ở auth-service (tạo/ký token) và api-gateway (kiểm tra token)
jjwtVersion=0.12.6
# springdoc 2.6.x nhắm tới Spring Boot 3.3.x (2.7+ nhắm tới Boot 3.4)
springdocVersion=2.6.0
