# Cấu hình cho test: H2 trong bộ nhớ, Hibernate tự tạo schema, tắt Flyway/Eureka/Config Server.
# Import Config Server đã bị bỏ qua ở profile test (xem application.yml); đặt thêm spring.cloud.config.enabled=false
# để Spring Cloud không đòi spring.config.import.
spring:
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:h2:mem:notification_test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  rabbitmq:
    listener:
      simple:
        # Không tự khởi động listener RabbitMQ khi test (không có broker).
        auto-startup: false
eureka:
  client:
    enabled: false
