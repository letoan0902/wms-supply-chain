# Notification Service (cổng 8085): lắng nghe RabbitMQ, gửi email cảnh báo và đẩy thông báo thời gian thực qua WebSocket.
server:
  port: ${SERVER_PORT:8085}
  shutdown: graceful

spring:
  application:
    name: notification-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  autoconfigure:
    exclude:
      # Không dùng user in-memory mặc định của Spring Boot (tránh in "generated security password" ra log).
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3306/notification_db?createDatabaseIfNotExist=true}"
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:change_me}
  jpa:
    open-in-view: false
    hibernate:
      # Schema do Flyway quản lý; Hibernate chỉ kiểm tra entity khớp schema.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        # Tin nhắn lỗi không được đưa lại hàng đợi vô hạn (tránh vòng lặp với tin nhắn hỏng).
        # Hết số lần thử lại thì broker chuyển tin sang wms.dlx (xem docs/MESSAGING.md mục 4).
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    # Tài khoản SMTP (để trống nếu SMTP không cần xác thực). Cổng 587 tự bật STARTTLS, cổng 465 tự bật SSL.
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      # Chỉ dùng cho dev; production đặt HEALTH_SHOW_DETAILS=never
      show-details: ${HEALTH_SHOW_DETAILS:always}
  health:
    mail:
      # Không để SMTP chưa chạy làm /actuator/health báo DOWN.
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  # Tách dữ liệu theo doanh nghiệp (docs/MULTI_TENANT.md, WMS-22.4c): API nghiệp vụ không có doanh nghiệp nhận 403
  # COMPANY_REQUIRED. Doanh nghiệp mặc định chỉ đặt ở máy phát triển, máy chủ để rỗng.
  tenant:
    required: true
    default-company-id: ${TENANT_DEFAULT_COMPANY_ID:}
    public-paths:
      # Handshake WebSocket không mang được header từ trình duyệt; doanh nghiệp lấy từ JWT ở frame STOMP CONNECT.
      - /ws-wms/**
      # Chỉ trả cấu hình RabbitMQ và SMTP đang chạy, không có dữ liệu của doanh nghiệp nào.
      - /api/notifications/health-info
  mail:
    from: ${MAIL_FROM:no-reply@wms.local}
  rabbitmq:
    exchange: ${NOTIFICATION_EXCHANGE:wms.events}
    queue: ${NOTIFICATION_QUEUE:notification.alerts}
    routing-key: ${NOTIFICATION_ROUTING_KEY:alert.#}
  # Hub WebSocket STOMP /ws-wms (WMS-02.3, xem docs/MESSAGING.md mục 8)
  websocket:
    # Bật thì frame CONNECT phải mang header Authorization: Bearer <accessToken> hợp lệ; dùng chung công tắc với gateway.
    # Bật hay tắt, SUBSCRIBE chỉ được vào /topic/company/{companyId}/** của doanh nghiệp trong token (tắt thì token
    # không bắt buộc, phiên không có token dùng app.tenant.default-company-id).
    auth-required: ${GATEWAY_JWT_ENABLED:false}
    # PHẢI trùng JWT_SECRET của auth-service và api-gateway. Chỉ là giá trị dev, đổi ở môi trường thật.
    jwt-secret: ${JWT_SECRET:change_me_dev_only_jwt_secret_key_min_32_bytes}
    # Origin được phép mở kết nối, phân tách bằng dấu phẩy (cùng biến với CORS của gateway).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
---
# Nạp cấu hình tập trung từ Config Server. Tiền tố optional nghĩa là Config Server chưa chạy thì service vẫn
# khởi động bằng cấu hình cục bộ ở trên. Tài liệu này bị bỏ qua khi chạy test (profile test) để test không gọi mạng.
spring:
  config:
    activate:
      on-profile: "!test"
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
