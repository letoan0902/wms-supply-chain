# Order Service (cổng 8084): nhà cung cấp, khách hàng, đơn mua (PO/GRN), đơn bán (SO/GDN).
server:
  port: ${SERVER_PORT:8084}
  shutdown: graceful

spring:
  application:
    name: order-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  autoconfigure:
    exclude:
      # Không dùng user in-memory mặc định của Spring Boot (tránh in "generated security password" ra log).
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3306/order_db?createDatabaseIfNotExist=true}"
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:change_me}
    hikari:
      # Xác nhận đơn bán, lập và xuất phiếu xuất kho, lập phiếu nhập giữ một kết nối trong lúc gọi đồng bộ sang
      # inventory-service (tối đa connect-timeout + read-timeout của Feign bên dưới), nên cần nhiều kết nối hơn mặc định
      # 10 (docs/PERFORMANCE.md mục 5.3). Cộng mọi nhóm của mọi service phải nhỏ hơn max_connections của MySQL (151).
      maximum-pool-size: ${DB_POOL_SIZE:20}
  jpa:
    open-in-view: false
    hibernate:
      # Schema do Flyway quản lý; Hibernate chỉ kiểm tra entity khớp schema.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # Nạp quan hệ lazy theo lô (một câu IN cho cả trang) thay vì một câu cho mỗi bản ghi (WMS-19.3, docs/PERFORMANCE.md)
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        # Hết số lần thử lại thì không đẩy lại queue; broker chuyển message sang wms.dlx (xem docs/MESSAGING.md mục 4)
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
    template:
      retry:
        enabled: true
        max-attempts: 3
        initial-interval: 500ms
  cloud:
    openfeign:
      client:
        config:
          # Gọi đồng bộ sang service khác (inventory-service, product-service): không chờ quá lâu để request của người dùng không treo
          default:
            connect-timeout: 3000
            read-timeout: 5000

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      # Chỉ dùng cho dev; production đặt HEALTH_SHOW_DETAILS=never
      show-details: ${HEALTH_SHOW_DETAILS:always}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# Tách dữ liệu theo doanh nghiệp (docs/MULTI_TENANT.md, WMS-22.4b): request không xác định được doanh nghiệp nhận
# 403 COMPANY_REQUIRED. Doanh nghiệp mặc định chỉ dành cho máy phát triển chạy không qua gateway (docker-compose.yml
# đặt 1); trên máy chủ biến này để rỗng (deploy/docker-compose.prod.yml).
app:
  tenant:
    required: true
    default-company-id: ${TENANT_DEFAULT_COMPANY_ID:}
  # Danh tính từ header của api-gateway (docs/SECURITY.md, WMS-20.3). true (máy phát triển, gateway tắt kiểm tra JWT):
  # request không có X-User-Name được coi là nhà phát triển đủ vai trò. Máy chủ đặt SECURITY_ALLOW_ANONYMOUS=false
  # (deploy/docker-compose.prod.yml): request thiếu danh tính nhận 401 ngay tại service.
  security:
    allow-anonymous-without-gateway: ${SECURITY_ALLOW_ANONYMOUS:true}
  # Nhóm kết nối riêng để cấp số chứng từ (WMS-20.4, docs/PERFORMANCE.md mục 5): mỗi kết nối chỉ bị giữ vài mili giây,
  # tách khỏi nhóm chính để request lập chứng từ không chờ kết nối thứ hai của nhóm mà nó đang giữ một kết nối.
  document-sequence:
    pool-size: ${DOCUMENT_SEQUENCE_POOL_SIZE:3}

---
# Nạp cấu hình tập trung từ Config Server. Tiền tố optional nghĩa là Config Server chưa chạy thì service vẫn
# khởi động bằng cấu hình cục bộ ở trên. Tài liệu này bị bỏ qua khi chạy test (profile test) để test không gọi mạng.
spring:
  config:
    activate:
      on-profile: "!test"
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
