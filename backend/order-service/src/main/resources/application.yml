# Order Service (cổng 8084): nhà cung cấp, khách hàng, đơn mua (PO/GRN), đơn bán (SO/GDN).
server:
  port: ${SERVER_PORT:8084}
  shutdown: graceful

spring:
  application:
    name: order-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  autoconfigure:
    exclude:
      # Không dùng user in-memory mặc định của Spring Boot (tránh in "generated security password" ra log).
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3306/order_db?createDatabaseIfNotExist=true}"
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:change_me}
  jpa:
    open-in-view: false
    hibernate:
      # Schema do Flyway quản lý; Hibernate chỉ kiểm tra entity khớp schema.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        # Hết số lần thử lại thì không đẩy lại queue; broker chuyển message sang wms.dlx (xem docs/MESSAGING.md mục 4)
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
    template:
      retry:
        enabled: true
        max-attempts: 3
        initial-interval: 500ms
  cloud:
    openfeign:
      client:
        config:
          # Gọi đồng bộ sang service khác (inventory-service, product-service): không chờ quá lâu để request của người dùng không treo
          default:
            connect-timeout: 3000
            read-timeout: 5000

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      # Chỉ dùng cho dev; production đặt HEALTH_SHOW_DETAILS=never
      show-details: ${HEALTH_SHOW_DETAILS:always}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# Tách dữ liệu theo doanh nghiệp (docs/MULTI_TENANT.md, WMS-22.4b): request không xác định được doanh nghiệp nhận
# 403 COMPANY_REQUIRED. Doanh nghiệp mặc định chỉ dành cho máy phát triển chạy không qua gateway (docker-compose.yml
# đặt 1); trên máy chủ biến này để rỗng (deploy/docker-compose.prod.yml).
app:
  tenant:
    required: true
    default-company-id: ${TENANT_DEFAULT_COMPANY_ID:}

---
# Nạp cấu hình tập trung từ Config Server. Tiền tố optional nghĩa là Config Server chưa chạy thì service vẫn
# khởi động bằng cấu hình cục bộ ở trên. Tài liệu này bị bỏ qua khi chạy test (profile test) để test không gọi mạng.
spring:
  config:
    activate:
      on-profile: "!test"
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
