# Cấu hình Nginx cho frontend WMS Supply Chain:
# phục vụ SPA React và chuyển tiếp /api/ tới API Gateway trong mạng Docker Compose.

# Hỗ trợ WebSocket (thông báo thời gian thực ở Sprint 4): chỉ gửi Connection: upgrade khi client yêu cầu nâng cấp
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Nén gzip cho tài nguyên dạng văn bản
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/json application/javascript text/javascript application/xml image/svg+xml;

    # Header bảo mật cơ bản
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Reverse proxy: /api/... -> http://api-gateway:8080/api/...
    # Dùng resolver của Docker và biến để Nginx vẫn khởi động được khi api-gateway chưa chạy,
    # đồng thời tự phân giải lại địa chỉ khi container api-gateway được tạo lại.
    # proxy_pass không có phần URI nên giữ nguyên đường dẫn gốc (bao gồm tiền tố /api/).
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_gateway http://api-gateway:8080;
        proxy_pass $api_gateway;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Tài nguyên build có hash trong tên file: cache dài hạn
    location /assets/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # index.html không được cache để người dùng luôn nhận bản build mới nhất
    location = /index.html {
        expires -1;
    }

    # SPA fallback: mọi đường dẫn khác trả về index.html để React Router xử lý
    location / {
        try_files $uri $uri/ /index.html;
    }
}
